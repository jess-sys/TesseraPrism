name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust host crates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: System dependencies (btleplug / serialport)
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev libudev-dev pkg-config
      - uses: Swatinem/rust-cache@v2
      - name: Test
        run: cargo test --workspace
      - name: Core crates build for wasm32
        run: cargo build -p prism-core -p prism-proto -p prism-ctap -p prism-ui --target wasm32-unknown-unknown

  web:
    name: Web companion
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh
      - name: Build wasm core
        run: wasm-pack build crates/prism-wasm --target web --out-dir ../../apps/web/src/wasm/pkg
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
        working-directory: apps/web
      - run: npm test
        working-directory: apps/web
      - run: npm run build
        working-directory: apps/web

  swift:
    name: Swift packages
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: PrismKit tests
        run: swift test
        working-directory: apps/apple/PrismKit
