[package]
name = "prism-ctap"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
prism-core.workspace = true
p256 = { version = "0.13", default-features = false, features = ["ecdsa", "arithmetic"] }
ed25519-dalek = { version = "2", default-features = false, features = ["zeroize"] }
hmac = "0.12"
sha2 = { version = "0.10", default-features = false }
subtle = { version = "2", default-features = false }

# p256 pulls rand_core/getrandom; browsers need the "js" backend (unused at runtime: we never call it).
[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
getrandom = { version = "0.2", features = ["js"] }
