[workspace]
resolver = "2"
members = ["crates/*"]
exclude = ["firmware"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
authors = ["Neutheria Systems"]
repository = "https://github.com/jess-sys/TesseraPrism"

[workspace.dependencies]
prism-core = { path = "crates/prism-core" }
prism-proto = { path = "crates/prism-proto" }
prism-ctap = { path = "crates/prism-ctap" }
prism-ui = { path = "crates/prism-ui" }
prism-client = { path = "crates/prism-client" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
postcard = { version = "1", features = ["use-std"] }
zeroize = { version = "1", features = ["derive", "serde"] }
thiserror = "1"
