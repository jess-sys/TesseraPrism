[build]
target = "xtensa-esp32s3-espidf"

[target.xtensa-esp32s3-espidf]
linker = "ldproxy"
# Flash with the custom partition table. If TinyUSB owns the USB port, hold BOOT (GPIO0)
# while powering on to enter the ROM download mode first.
runner = "espflash flash --monitor --partition-table partitions.csv --flash-size 16mb"
rustflags = ["--cfg", "espidf_time64"]

[unstable]
build-std = ["std", "panic_abort"]

[env]
MCU = "esp32s3"
ESP_IDF_VERSION = "v5.5.6"
ESP_IDF_SDKCONFIG_DEFAULTS = "sdkconfig.defaults"
# Copy partitions.csv into the generated ESP-IDF CMake project (referenced from sdkconfig.defaults).
ESP_IDF_GLOB_PARTITIONS_BASE = { value = ".", relative = true }
ESP_IDF_GLOB_PARTITIONS_FILE = "partitions.csv"
