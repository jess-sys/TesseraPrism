[package]
name = "prism-firmware"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/jess-sys/TesseraPrism"
rust-version = "1.82"
resolver = "2"

# Standalone project: NOT part of the host workspace (the root Cargo.toml excludes firmware/).
[workspace]

[[bin]]
name = "prism-firmware"
harness = false

[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
debug = false

[profile.dev]
debug = true
opt-level = "z"

[features]
default = []
# Keep the USB-Serial-JTAG for logs (disables TinyUSB). Build with
#   ESP_IDF_SDKCONFIG_DEFAULTS="sdkconfig.defaults;sdkconfig.jtag" cargo build --features jtag-console
jtag-console = []
# Diagnostic: with jtag-console, still really power off (to debug the shutdown path).
jtag-real-off = []

[dependencies]
esp-idf-svc = { version = "0.53", default-features = true }
esp-idf-hal = "0.47"
esp-idf-sys = { version = "0.38", features = ["binstart"] }
embedded-graphics = "0.8"
log = "0.4"
anyhow = "1"
esp32-nimble = "0.13"
zeroize = "1"
rand_core = "0.6"
postcard = { version = "1", features = ["use-std"] }
serde = { version = "1", features = ["derive"] }

prism-core = { path = "../crates/prism-core" }
prism-proto = { path = "../crates/prism-proto" }
prism-ctap = { path = "../crates/prism-ctap" }
prism-ui = { path = "../crates/prism-ui" }

[build-dependencies]
embuild = "0.33"

# esp_tinyusb must stay on 1.x: esp-idf-sys 0.38 bindings.h includes 1.x headers (tinyusb_types.h).
# Local C component (epdiy board definition for Paper S3 + flat C shim), epdiy and TinyUSB from the
# ESP component registry.
[[package.metadata.esp-idf-sys.extra_components]]
remote_component = { name = "vroland/epdiy", version = "2.1.3" }

[[package.metadata.esp-idf-sys.extra_components]]
remote_component = { name = "espressif/esp_tinyusb", version = "1.7.6" }

[[package.metadata.esp-idf-sys.extra_components]]
component_dirs = ["components"]
bindings_header = "components/prism_epd/include/prism_epd.h"
